<!DOCTYPE html>
<html lang="gu">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>het AI</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; font-family: Arial, sans-serif; }
  body { background: #0f172a; color: #fff; display: flex; flex-direction: column; height: 100vh; }
  header { background: #1e293b; padding: 12px 15px; display: flex; justify-content: space-between; align-items: center; }
  h1 { font-size: 1.2rem; color: #38bdf8; }
  .btn-top { background: #334155; color: #fff; border: none; padding: 6px 12px; border-radius: 12px; }
  #chat { flex: 1; overflow-y: auto; padding: 15px; display: flex; flex-direction: column; gap: 12px; }
  .msg { max-width: 85%; padding: 10px 14px; border-radius: 12px; line-height: 1.4; font-size: 0.95rem; }
  .u { background: #2563eb; align-self: flex-end; }
  .a { background: #1e293b; border: 1px solid #334155; align-self: flex-start; }
  .cp { display: block; margin-top: 6px; background: #334155; color: #38bdf8; border: none; padding: 3px 8px; border-radius: 5px; font-size: 0.75rem; }
  #fprev { background: #1e293b; padding: 5px 15px; font-size: 0.8rem; color: #38bdf8; display: none; justify-content: space-between; }
  .bar { background: #1e293b; padding: 10px; display: flex; gap: 6px; align-items: center; }
  .ibtn { background: #334155; color: #38bdf8; border: none; width: 38px; height: 38px; border-radius: 50%; font-size: 1.1rem; }
  #inp { flex: 1; min-width: 0; padding: 10px; border-radius: 20px; border: 1px solid #475569; background: #0f172a; color: #fff; outline: none; }
  #sbtn { background: #38bdf8; color: #0f172a; border: none; padding: 10px 15px; border-radius: 20px; font-weight: bold; }
</style>
</head>
<body>
<header>
  <h1>✨ het AI</h1>
  <button class="btn-top" onclick="clr()">🗑️ નવી ચેટ</button>
</header>
<div id="chat"></div>
<div id="fprev"><span id="fname"></span><span onclick="clrF()" style="color:#ef4444">✖</span></div>
<div class="bar">
  <input type="file" id="finp" accept="image/*,application/pdf,text/plain" hidden onchange="selF(event)">
  <button class="ibtn" onclick="finp.click()">📎</button>
  <button class="ibtn" id="mbtn" onclick="mic()">🎤</button>
  <input type="text" id="inp" placeholder="પૂછો..." onkeypress="if(event.key==='Enter') send()">
  <button id="sbtn" onclick="send()">મોકલો</button>
</div>
<script>
let hist = JSON.parse(localStorage.getItem('het_ai_h') || '[]'), fData = null;
function show() {
  chat.innerHTML = '';
  if (!hist.length) add("નમસ્તે! હું <b>het AI</b> છું (હેત પટેલ દ્વારા નિર્મિત). પૂછો, 🎤 બોલો અથવા 📎 ફાઇલ મોકલો!", 0, 0);
  else hist.forEach(m => add(m.text, m.role === 'user', m.role === 'model'));
}
function add(t, isU, cp) {
  let d = document.createElement('div');
  d.className = 'msg ' + (isU ? 'u' : 'a');
  d.innerHTML = t.replace(/\n/g, '<br>');
  if (cp) {
    let b = document.createElement('button'); b.className = 'cp'; b.innerText = '📋 Copy';
    b.onclick = () => { navigator.clipboard.writeText(t); b.innerText = '✅'; };
    d.appendChild(b);
  }
  chat.appendChild(d); chat.scrollTop = chat.scrollHeight; return d;
}
function selF(e) {
  let f = e.target.files.item(0); if (!f) return;
  let r = new FileReader();
  r.onload = ev => { fData = { name: f.name, mimeType: f.type, base64: ev.target.result.split(',').at(1) }; fname.innerText = '📎 ' + f.name; fprev.style.display = 'flex'; };
  r.readAsDataURL(f);
}
function clrF() { fData = null; finp.value = ''; fprev.style.display = 'none'; }
function clr() { hist = []; localStorage.removeItem('het_ai_h'); clrF(); show(); }
function mic() {
  let SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (!SR) return alert("Chrome વાપરો");
  let r = new SR(); r.lang = 'gu-IN';
  r.onstart = () => mbtn.style.background = '#ef4444';
  r.onend = () => mbtn.style.background = '#334155';
  r.onresult = e => inp.value = e.results.item(0).item(0).transcript;
  r.start();
}
async function send() {
  let t = inp.value.trim(); if (!t && !fData) return;
  let uMsg = fData ? '📎 [' + fData.name + ']\n' + (t || 'આ ફાઇલ સમજાવો') : t;
  add(uMsg, 1, 0);
  let sendF = fData ? { base64: fData.base64, mimeType: fData.mimeType } : null;
  inp.value = ''; clrF();
  let ld = add('વિચારી રહ્યું છે...', 0, 0);
  try {
    let res = await fetch('/api/chat', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ message: t || 'આ ફાઇલ સમજાવો', history: hist, fileData: sendF })
    });
    let data = await res.json();
    if (data.reply) {
      hist.push({ role: 'user', text: uMsg }, { role: 'model', text: data.reply });
      localStorage.setItem('het_ai_h', JSON.stringify(hist)); show();
    } else ld.innerHTML = '❌ ' + (data.error ? data.error.message : 'ભૂલ');
  } catch (err) { ld.innerHTML = '❌ ' + err.message; }
}
show();
</script>
</body>
</html>
