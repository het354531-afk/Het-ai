<!DOCTYPE html>
<html lang="gu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>het AI - Smart Assistant</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: #0f172a; color: #f8fafc; display: flex; flex-direction: column; height: 100vh; }
        header { background-color: #1e293b; padding: 15px 20px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #334155; }
        header h1 { font-size: 1.4rem; color: #38bdf8; letter-spacing: 1px; }
        .status-badge { background: #064e3b; color: #34d399; padding: 5px 12px; border-radius: 20px; font-size: 0.8rem; font-weight: bold; }
        #chat-container { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 15px; }
        .message { max-width: 82%; padding: 12px 16px; border-radius: 14px; line-height: 1.5; font-size: 0.95rem; word-wrap: break-word; }
        .user-msg { background-color: #2563eb; color: white; align-self: flex-end; border-bottom-right-radius: 2px; }
        .ai-msg { background-color: #1e293b; color: #e2e8f0; align-self: flex-start; border-bottom-left-radius: 2px; border: 1px solid #334155; }
        .input-area { background-color: #1e293b; padding: 15px; display: flex; gap: 10px; border-top: 1px solid #334155; }
        #user-input { flex: 1; padding: 12px 16px; border-radius: 25px; border: 1px solid #475569; background-color: #0f172a; color: white; font-size: 1rem; outline: none; }
        #send-btn { background-color: #38bdf8; color: #0f172a; border: none; padding: 0 22px; border-radius: 25px; font-weight: bold; cursor: pointer; font-size: 1rem; }
        #send-btn:hover { background-color: #0284c7; color: white; }
    </style>
</head>
<body>

    <header>
        <h1>✨ het AI</h1>
        <span class="status-badge">● Online</span>
    </header>

    <div id="chat-container">
        <div class="message ai-msg">નમસ્તે! હું <b>het AI</b> છું. હું તમને કેવી રીતે મદદ કરી શકું?</div>
    </div>

    <div class="input-area">
        <input type="text" id="user-input" placeholder="અહીં કંઈ પણ પૂછો..." onkeypress="if(event.key==='Enter') sendMessage()">
        <button id="send-btn" onclick="sendMessage()">મોકલો</button>
    </div>

    <script>
        function addMessage(text, isUser) {
            const chat = document.getElementById('chat-container');
            const msgDiv = document.createElement('div');
            msgDiv.className = 'message ' + (isUser ? 'user-msg' : 'ai-msg');
            msgDiv.innerHTML = text.replace(/\n/g, '<br>');
            chat.appendChild(msgDiv);
            chat.scrollTop = chat.scrollHeight;
            return msgDiv;
        }

        async function sendMessage() {
            const input = document.getElementById('user-input');
            const text = input.value.trim();
            if (!text) return;

            addMessage(text, true);
            input.value = '';

            const loadingMsg = addMessage("વિચારી રહ્યું છે...", false);

            try {
                const response = await fetch('/api/chat', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ message: text })
                });

                const data = await response.json();

                if (data.reply) {
                    loadingMsg.innerHTML = data.reply.replace(/\n/g, '<br>');
                } else if (data.error) {
                    const errText = data.error.message || JSON.stringify(data.error);
                    loadingMsg.innerHTML = "❌ ભૂલ: " + errText;
                } else {
                    loadingMsg.innerHTML = "❌ કોઈ જવાબ મળ્યો નથી.";
                }
            } catch (error) {
                loadingMsg.innerHTML = "❌ નેટવર્ક સમસ્યા: " + error.message;
            }
        }
    </script>

</body>
</html>
