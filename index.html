<!DOCTYPE html>
<html lang="gu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>het AI - Smart Assistant</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: #0f172a; color: #f8fafc; display: flex; flex-direction: column; height: 100vh; }
        header { background-color: #1e293b; padding: 12px 16px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #334155; }
        header h1 { font-size: 1.3rem; color: #38bdf8; letter-spacing: 0.5px; }
        .clear-btn { background: #334155; color: #f8fafc; border: none; padding: 6px 12px; border-radius: 15px; font-size: 0.8rem; cursor: pointer; }
        .clear-btn:hover { background: #ef4444; }
        #chat-container { flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 14px; }
        .message { max-width: 85%; padding: 12px 15px; border-radius: 14px; line-height: 1.5; font-size: 0.95rem; word-wrap: break-word; position: relative; }
        .user-msg { background-color: #2563eb; color: white; align-self: flex-end; border-bottom-right-radius: 2px; }
        .ai-msg { background-color: #1e293b; color: #e2e8f0; align-self: flex-start; border-bottom-left-radius: 2px; border: 1px solid #334155; }
        .copy-btn { display: inline-block; margin-top: 8px; background: #334155; color: #38bdf8; border: none; padding: 4px 10px; border-radius: 6px; font-size: 0.75rem; cursor: pointer; }
        #file-preview { background: #1e293b; padding: 6px 14px; font-size: 0.82rem; color: #38bdf8; display: none; justify-content: space-between; align-items: center; border-top: 1px solid #334155; }
        .remove-file { color: #ef4444; cursor: pointer; font-weight: bold; margin-left: 10px; }
        .input-area { background-color: #1e293b; padding: 10px; display: flex; gap: 6px; border-top: 1px solid #334155; align-items: center; }
        .icon-btn { background-color: #334155; color: #38bdf8; border: none; width: 40px; height: 40px; border-radius: 50%; font-size: 1.1rem; cursor: pointer; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
        #mic-btn.listening { background-color: #ef4444; color: white; animation: pulse 1s infinite; }
        @keyframes pulse { 0% { transform: scale(1); } 50% { transform: scale(1.1); } 100% { transform: scale(1); } }
        #user-input { flex: 1; min-width: 0; padding: 10px 14px; border-radius: 25px; border: 1px solid #475569; background-color: #0f172a; color: white; font-size: 0.95rem; outline: none; }
        #send-btn { background-color: #38bdf8; color: #0f172a; border: none; padding: 10px 16px; border-radius: 25px; font-weight: bold; cursor: pointer; font-size: 0.95rem; flex-shrink: 0; }
    </style>
</head>
<body>

    <header>
        <h1>✨ het AI</h1>
        <button class="clear-btn" onclick="clearChat()">🗑️ નવી ચેટ</button>
    </header>

    <div id="chat-container"></div>

    <div id="file-preview">
        <span id="file-name">📎 ફાઇલ પસંદ થઈ</span>
        <span class="remove-file" onclick="clearFile()">✖ કાઢો</span>
    </div>

    <div class="input-area">
        <input type="file" id="file-input" accept="image/*,application/pdf,text/plain" style="display:none" onchange="handleFileSelect(event)">
        <button class="icon-btn" onclick="document.getElementById('file-input').click()" title="ફોટો કે PDF ઉમેરો">📎</button>
        <button class="icon-btn" id="mic-btn" onclick="startVoice()" title="બોલીને પૂછો">🎤</button>
        <input type="text" id="user-input" placeholder="પૂછો અથવા 📎 થી ફાઇલ મૂકો..." onkeypress="if(event.key==='Enter') sendMessage()">
        <button id="send-btn" onclick="sendMessage()">મોકલો</button>
    </div>

    <script>
        let chatHistory = JSON.parse(localStorage.getItem('het_ai_history')) || [];
        let selectedFile = null;

        function renderHistory() {
            const chat = document.getElementById('chat-container');
            chat.innerHTML = '';
            if (chatHistory.length === 0) {
                addMessageToUI("નમસ્તે! હું <b>het AI</b> છું (હેત પટેલ દ્વારા નિર્મિત). તમે મને સવાલ પૂછી શકો છો, 🎤 બોલી શકો છો અથવા 📎 થી ફોટો કે PDF મોકલી શકો છો!", false, false);
            } else {
                chatHistory.forEach(msg => {
                    addMessageToUI(msg.text, msg.role === 'user', msg.role === 'model');
                });
            }
        }

        function addMessageToUI(text, isUser, showCopy = false) {
            const chat = document.getElementById('chat-container');
            const msgDiv = document.createElement('div');
            msgDiv.className = 'message ' + (isUser ? 'user-msg' : 'ai-msg');
            
            const contentSpan = document.createElement('div');
            contentSpan.innerHTML = text.replace(/\n/g, '<br>');
            msgDiv.appendChild(contentSpan);

            if (showCopy) {
                const copyBtn = document.createElement('button');
                copyBtn.className = 'copy-btn';
                copyBtn.innerText = '📋 Copy';
                copyBtn.onclick = () => {
                    navigator.clipboard.writeText(text);
                    copyBtn.innerText = '✅ Copied!';
                    setTimeout(() => copyBtn.innerText = '📋 Copy', 2000);
                };
                msgDiv.appendChild(copyBtn);
            }

            chat.appendChild(msgDiv);
            chat.scrollTop = chat.scrollHeight;
            return contentSpan;
        }

        function handleFileSelect(event) {
            const file = event.target.files.item(0);
            if (!file) return;
            if (file.size > 4 * 1024 * 1024) {
                alert("મહેરબાની કરીને 4 MB થી નાની ફાઇલ અથવા ફોટો પસંદ કરો.");
                return;
            }
            const reader = new FileReader();
            reader.onload = function(e) {
                const base64String = e.target.result.split(',').item(1);
                selectedFile = {
                    name: file.name,
                    mimeType: file.type || 'application/octet-stream',
                    base64: base64String
                };
                document.getElementById('file-name').innerText = "📎 " + file.name;
                document.getElementById('file-preview').style.display = 'flex';
            };
            reader.readAsDataURL(file);
        }

        function clearFile() {
            selectedFile = null;
            document.getElementById('file-input').value = '';
            document.getElementById('file-preview').style.display = 'none';
        }

        function clearChat() {
            chatHistory = [];
            localStorage.removeItem('het_ai_history');
            clearFile();
            renderHistory();
        }

        function startVoice() {
            const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
            if (!SpeechRecognition) {
                alert("તમારા બ્રાઉઝરમાં વૉઇસ ટાઇપિંગ સપોર્ટ નથી. Google Chrome વાપરો.");
                return;
            }
            const recognition = new SpeechRecognition();
            recognition.lang = 'gu-IN';
            recognition.interimResults = false;
            const micBtn = document.getElementById('mic-btn');
            const inputBox = document.getElementById('user-input');
            
            recognition.onstart = () => {
                micBtn.classList.add('listening');
                inputBox.placeholder = "બોલો, હું સાંભળું છું...";
            };
            recognition.onend = () => {
                micBtn.classList.remove('listening');
                inputBox.placeholder = "પૂછો અથવા 📎 થી ફાઇલ મૂકો...";
            };
            recognition.onerror = (event) => {
                micBtn.classList.remove('listening');
                alert("માઇક એરર: " + event.error + " (બ્રાઉઝરમાં Microphone પરવાનગી Allow કરો)");
            };
            recognition.onresult = (event) => {
                const firstResult = event.results.item(0);
                const transcript = firstResult.item(0).transcript;
                inputBox.value = transcript;
            };
            recognition.start();
        }

        async function sendMessage() {
            const input = document.getElementById('user-input');
            const text = input.value.trim();
            if (!text && !selectedFile) return;

            const displayUserMsg = selectedFile ? ("📎 [" + selectedFile.name + "]\n" + (text || "આ ફાઇલ સમજાવો.")) : text;
            addMessageToUI(displayUserMsg, true, false);
            
            const fileToSend = selectedFile ? { base64: selectedFile.base64, mimeType: selectedFile.mimeType } : null;
            input.value = '';
            clearFile();

            const loadingSpan = addMessageToUI("વિચારી રહ્યું છે...", false, false);

            try {
                const response = await fetch('/api/chat', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        message: text || "આ ફાઇલ સમજાવો.",
                        history: chatHistory,
                        fileData: fileToSend
                    })
                });

                const data = await response.json();

                if (data.reply) {
                    chatHistory.push({ role: 'user', text: displayUserMsg });
                    chatHistory.push({ role: 'model', text: data.reply });
                    localStorage.setItem('het_ai_history', JSON.stringify(chatHistory));
                    renderHistory();
                } else if (data.error) {
                    const errText = data.error.message || JSON.stringify(data.error);
                    loadingSpan.innerHTML = "❌ ભૂલ: " + errText;
