<!DOCTYPE html>
<html lang="gu">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>het AI - Smart Gujarati Assistant</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', system-ui, Arial, sans-serif; }
  body { background: #0f172a; color: #fff; display: flex; flex-direction: column; height: 100vh; height: 100dvh; overflow: hidden; }
  header { background: #1e293b; padding: 12px 15px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #334155; flex-shrink: 0; }
  h1 { font-size: 1.2rem; color: #38bdf8; display: flex; align-items: center; gap: 6px; }
  .btn-top { background: #334155; color: #fff; border: none; padding: 6px 12px; border-radius: 12px; font-size: 0.85rem; cursor: pointer; }
  #chat { flex: 1; overflow-y: auto; padding: 15px; display: flex; flex-direction: column; gap: 12px; }
  .msg { max-width: 85%; padding: 11px 14px; border-radius: 14px; line-height: 1.5; font-size: 0.95rem; word-break: break-word; }
  .u { background: #2563eb; align-self: flex-end; border-bottom-right-radius: 4px; }
  .a { background: #1e293b; border: 1px solid #334155; align-self: flex-start; border-bottom-left-radius: 4px; }
  .cp { display: inline-block; margin-top: 8px; background: #334155; color: #38bdf8; border: none; padding: 4px 10px; border-radius: 6px; font-size: 0.78rem; cursor: pointer; }
  #fprev { background: #1e293b; padding: 7px 15px; font-size: 0.82rem; color: #38bdf8; display: none; justify-content: space-between; align-items: center; border-top: 1px solid #334155; flex-shrink: 0; }
  .bar { background: #1e293b; padding: 10px; display: flex; gap: 7px; align-items: center; border-top: 1px solid #334155; flex-shrink: 0; }
  .ibtn { background: #334155; color: #38bdf8; border: none; width: 40px; height: 40px; border-radius: 50%; font-size: 1.15rem; display: flex; align-items: center; justify-content: center; flex-shrink: 0; cursor: pointer; transition: 0.2s; }
  .mic-active { background: #ef4444 !important; color: #fff !important; animation: pulse 1s infinite; }
  @keyframes pulse { 0% { transform: scale(1); } 50% { transform: scale(1.1); } 100% { transform: scale(1); } }
  #inp { flex: 1; min-width: 0; padding: 10px 14px; border-radius: 20px; border: 1px solid #475569; background: #0f172a; color: #fff; font-size: 0.95rem; outline: none; }
  #inp:focus { border-color: #38bdf8; }
  #sbtn { background: #38bdf8; color: #0f172a; border: none; padding: 10px 16px; border-radius: 20px; font-weight: bold; font-size: 0.95rem; flex-shrink: 0; cursor: pointer; }
</style>
</head>
<body>
<header>
  <h1>✨ het AI</h1>
  <button class="btn-top" onclick="clr()">🗑️ નવી ચેટ</button>
</header>
<div id="chat"></div>
<div id="fprev"><span id="fname"></span><span onclick="clrF()" style="color:#ef4444; font-weight:bold; padding:2px 6px; cursor:pointer;">✖</span></div>
<div class="bar">
  <input type="file" id="finp" accept="image/*,.pdf,application/pdf,.txt,text/plain" hidden onchange="selF(event)">
  <button class="ibtn" onclick="finp.click()" title="ફોટો અથવા PDF મોકલો">📎</button>
  <button class="ibtn" id="mbtn" onclick="mic()" title="ગુજરાતીમાં બોલો">🎤</button>
  <input type="text" id="inp" placeholder="પૂછો અથવા બોલો..." onkeypress="if(event.key==='Enter') send()">
  <button id="sbtn" onclick="send()">મોકલો</button>
</div>
<script>
let hist = JSON.parse(localStorage.getItem('het_ai_h') || '[]'), fData = null, recog = null, isListening = false;

function show() {
  chat.innerHTML = '';
  if (!hist.length) add("નમસ્તે! હું <b>het AI</b> છું (હેત પટેલ દ્વારા નિર્મિત). ગુજરાતીમાં પૂછો, 🎤 માઇકથી બોલો અથવા 📎 ફોટો / PDF મોકલો!", 0, 0);
  else hist.forEach(m => add(m.text, m.role === 'user', m.role === 'model'));
}

function add(t, isU, cp) {
  let d = document.createElement('div'); d.className = 'msg ' + (isU ? 'u' : 'a');
  d.innerHTML = t.replace(/\n/g, '<br>');
  if (cp) { let b = document.createElement('button'); b.className = 'cp'; b.innerText = '📋 Copy'; b.onclick = () => { navigator.clipboard.writeText(t); b.innerText = '✅ Copied'; setTimeout(() => b.innerText = '📋 Copy', 1500); }; d.appendChild(b); }
  chat.appendChild(d); chat.scrollTop = chat.scrollHeight; return d;
}

function selF(e) {
  let f = e.target.files.item(0); if (!f) return;
  let r = new FileReader();
  r.onload = ev => {
    if (f.type.startsWith('image/')) {
      let img = new Image();
      img.onload = () => {
        let cv = document.createElement('canvas'), max = 1000, w = img.width, h = img.height;
        if (w > max || h > max) { if (w > h) { h *= max / w; w = max; } else { w *= max / h; h = max; } }
        cv.width = w; cv.height = h; cv.getContext('2d').drawImage(img, 0, 0, w, h);
        let dataUrl = cv.toDataURL('image/jpeg', 0.7);
        fData = { name: f.name, mimeType: 'image/jpeg', base64: dataUrl.split(',').at(1) };
        fname.innerText = '🖼️ ' + f.name; fprev.style.display = 'flex';
      };
      img.src = ev.target.result;
    } else {
      if (f.size > 4 * 1024 * 1024) return alert('કૃપા કરીને 4 MB થી નાની PDF કે ફાઈલ પસંદ કરો.');
      let mType = f.type || (f.name.toLowerCase().endsWith('.pdf') ? 'application/pdf' : 'text/plain');
      fData = { name: f.name, mimeType: mType, base64: ev.target.result.split(',').at(1) };
      fname.innerText = '📄 ' + f.name; fprev.style.display = 'flex';
    }
  };
  r.readAsDataURL(f);
}

function clrF() { fData = null; finp.value = ''; fprev.style.display = 'none'; }
function clr() { hist = []; localStorage.removeItem('het_ai_h'); clrF(); show(); }

function mic() {
  let SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (!SR) return alert("માઇક વાપરવા માટે Google Chrome બ્રાઉઝર વાપરો.");
  if (isListening && recog) { recog.stop(); return; }
  recog = new SR();
  recog.lang = 'gu-IN';
  recog.interimResults = true;
  recog.continuous = false;
  let baseText = inp.value ? inp.value + ' ' : '';

  recog.onstart = () => { isListening = true; mbtn.classList.add('mic-active'); inp.placeholder = "સાંભળી રહ્યું છે... બોલો 🎙️"; };
  recog.onresult = e => {
    let spoken = '';
    for (let i = 0; i < e.results.length; i++) { spoken += e.results[i][0].transcript; }
    inp.value = baseText + spoken;
  };
  recog.onerror = e => {
    if (e.error === 'not-allowed') alert("કૃપા કરીને Chrome સેટિંગ્સમાંથી Microphone ની પરમિશન ચાલુ (Allow) કરો.");
  };
  recog.onend = () => { isListening = false; mbtn.classList.remove('mic-active'); inp.placeholder = "પૂછો અથવા બોલો..."; inp.focus(); };
  recog.start();
}

async function send() {
  if (isListening && recog) recog.stop();
  let t = inp.value.trim(); if (!t && !fData) return;
  let uMsg = fData ? '📎 [' + fData.name + ']\n' + (t || 'આ ફાઇલ / PDF સમજાવો') : t;
  add(uMsg, 1, 0);
  let sendF = fData ? { base64: fData.base64, mimeType: fData.mimeType } : null;
  inp.value = ''; clrF();
  let ld = add('વિચારી રહ્યું છે...', 0, 0);
  try {
    let res = await fetch('/api/chat', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ message: t || 'આ ફાઇલ / PDF સમજાવો', history: hist.slice(-6), fileData: sendF })
    });
    let txt = await res.text(), data;
    try { data = JSON.parse(txt); } catch { return ld.innerHTML = '❌ ફાઇલ મોટી છે, 4 MB થી નાની ફાઇલ મોકલો.'; }
    if (data.reply) {
      hist.push({ role: 'user', text: uMsg }, { role: 'model', text: data.reply });
      localStorage.setItem('het_ai_h', JSON.stringify(hist)); show();
    } else ld.innerHTML = '❌ ' + (data.error ? data.error.message : 'ભૂલ આવી છે, ફરી પ્રયાસ કરો.');
  } catch (err) { ld.innerHTML = '❌ ' + err.message; }
}
show();
</script>
</body>
</html>
