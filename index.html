<!DOCTYPE html>
<html lang="gu">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>het AI</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; }
    body { background-color: #0f172a; color: #f8fafc; display: flex; flex-direction: column; height: 100vh; }
    header { background-color: #1e293b; padding: 14px 18px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #334155; }
    .logo { font-size: 20px; font-weight: bold; color: #38bdf8; }
    .key-btn { background-color: #334155; color: #e2e8f0; border: 1px solid #475569; padding: 6px 12px; border-radius: 8px; cursor: pointer; font-size: 14px; }
    #keyBox { display: none; background-color: #1e293b; padding: 12px 18px; border-bottom: 1px solid #334155; gap: 8px; }
    #keyBox input { flex: 1; padding: 10px; border-radius: 8px; border: 1px solid #475569; background: #0f172a; color: white; }
    #keyBox button { background-color: #16a34a; color: white; border: none; padding: 10px 16px; border-radius: 8px; cursor: pointer; font-weight: bold; }
    #chatArea { flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 12px; }
    .msg { max-width: 82%; padding: 12px 16px; border-radius: 14px; line-height: 1.5; font-size: 15px; white-space: pre-wrap; word-wrap: break-word; }
    .bot { background-color: #1e293b; color: #f1f5f9; align-self: flex-start; border: 1px solid #334155; }
    .user { background-color: #2563eb; color: white; align-self: flex-end; }
    footer { background-color: #1e293b; padding: 12px; display: flex; gap: 8px; border-top: 1px solid #334155; }
    #promptInput { flex: 1; padding: 12px 16px; border-radius: 24px; border: 1px solid #475569; background-color: #0f172a; color: white; font-size: 15px; outline: none; }
    #sendBtn { background-color: #0284c7; color: white; border: none; padding: 0 20px; border-radius: 24px; font-weight: bold; cursor: pointer; font-size: 15px; }
  </style>
</head>
<body>

  <header>
    <div class="logo">✨ het AI</div>
    <button class="key-btn" onclick="toggleKeyBox()">⚙️ API Key</button>
  </header>

  <div id="keyBox">
    <input type="password" id="apiKeyInput" placeholder="તમારી Gemini API Key (AQ...) પેસ્ટ કરો...">
    <button onclick="saveKey()">Save</button>
  </div>

  <div id="chatArea">
    <div class="msg bot">નમસ્તે! હું het AI છું. હું તમને કેવી રીતે મદદ કરી શકું? (જવાબ મેળવવા ઉપર ⚙️ API Key પર ક્લિક કરીને તમારી કી સેવ કરો).</div>
  </div>

  <footer>
    <input type="text" id="promptInput" placeholder="અહીં કંઈ પણ પૂછો..." onkeypress="if(event.key==='Enter') sendMessage()">
    <button id="sendBtn" onclick="sendMessage()">મોકલો</button>
  </footer>

  <script>
    window.onload = () => {
      const saved = localStorage.getItem('HET_AI_KEY');
      if (saved) document.getElementById('apiKeyInput').value = saved;
    };

    function toggleKeyBox() {
      const box = document.getElementById('keyBox');
      box.style.display = box.style.display === 'flex' ? 'none' : 'flex';
    }

    function saveKey() {
      const cleanKey = document.getElementById('apiKeyInput').value.trim();
      if (!cleanKey) return alert("કૃપા કરીને સાચી API Key નાખો.");
      localStorage.setItem('HET_AI_KEY', cleanKey);
      document.getElementById('apiKeyInput').value = cleanKey;
      alert("API Key સેવ થઈ ગઈ છે!");
      document.getElementById('keyBox').style.display = 'none';
    }

    function addMessage(text, sender) {
      const chatArea = document.getElementById('chatArea');
      const div = document.createElement('div');
      div.className = 'msg ' + sender;
      div.innerText = text;
      chatArea.appendChild(div);
      chatArea.scrollTop = chatArea.scrollHeight;
      return div;
    }

    async function sendMessage() {
      const input = document.getElementById('promptInput');
      const text = input.value.trim();
      const cleanKey = (localStorage.getItem('HET_AI_KEY') || '').trim();

      if (!text) return;
      if (!cleanKey) {
        alert("પહેલા ઉપર ⚙️ API Key પર ક્લિક કરીને તમારી કી સેવ કરો.");
        toggleKeyBox();
        return;
      }

      addMessage(text, 'user');
      input.value = '';
      const loadingMsg = addMessage("વિચારી રહ્યું છે...", 'bot');

      try {
        const apiUrl = "https://googleapis.com";
        const res = await fetch(apiUrl, {
          method: "POST",
          headers: { 
            "Content-Type": "application/json",
            "x-goog-api-key": cleanKey
          },
          body: JSON.stringify({
            contents: [{ parts: [{ text: text }] }]
          })
        });

        const data = await res.json();

        if (data.error) {
          loadingMsg.innerText = "❌ Google API ભૂલ: " + data.error.message;
        } else if (data.candidates && data.candidates) {
          loadingMsg.innerText = data.candidates.content.parts.text;
        } else {
          loadingMsg.innerText = "❌ કોઈ જવાબ મળ્યો નહીં.";
        }
      } catch (err) {
        loadingMsg.innerText = "❌ નેટવર્ક સમસ્યા: " + err.message;
      }
    }
  </script>

</body>
</html>
